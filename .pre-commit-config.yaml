repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.5.5" # Use a recent Ruff version
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v1.11.1" # Use a recent Mypy version
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: python
        types: [python]
        args: [--strict]
        additional_dependencies:
          - "pydantic>=2.0.0" # For Pydantic model checking
          - types-requests
          - types-tqdm
          - "typer" # typer uses click, needs stubs for click
          - mypy
          - pytest
          - python-dotenv
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.1.0" # Use a recent Prettier version or your preferred one
    hooks:
      - id: prettier
        types_or: [markdown, yaml] # Run on Markdown and YAML files
